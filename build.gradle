plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.offlineplayer.cineoffline'
    compileSdk 35

    defaultConfig {
        applicationId 'com.offlineplayer.cineoffline'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '4.0.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['.']
            java.exclude 'build/**'
            // Arquivo antigo da identificação por OCR/ML Kit. Esse recurso foi removido
            // do Cine Offline, então ele não deve mais participar da compilação.
            java.exclude 'ContentTitleIdentifier.java'
            res.srcDirs = ["${buildDir}/generated/cineRes"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def generatedRes = file("${buildDir}/generated/cineRes")
def prepareGeneratedRes = tasks.register('prepareGeneratedRes') {
    doLast {
        def drawable = new File(generatedRes, 'drawable')
        drawable.mkdirs()
        def xml = new File(generatedRes, 'xml')
        xml.mkdirs()
        def sourceIcon = file('icone.png')
        if (!sourceIcon.exists()) {
            throw new GradleException('icone.png não encontrado na raiz do repositório.')
        }
        copy {
            from sourceIcon
            into drawable
            rename { 'icone.png' }
        }
        new File(xml, 'cine_title_accessibility.xml').text = '''<?xml version="1.0" encoding="utf-8"?>
<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
    android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewScrolled"
    android:accessibilityFeedbackType="feedbackGeneric"
    android:notificationTimeout="120"
    android:canRetrieveWindowContent="true"
    android:canTakeScreenshot="true"
    android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
    android:packageNames="com.starshort.minishort" />
'''
    }
}

tasks.named('preBuild').configure {
    dependsOn prepareGeneratedRes
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
